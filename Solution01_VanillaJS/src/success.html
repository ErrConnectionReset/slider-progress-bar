<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交成功</title>
    <link rel="stylesheet" href="css/reset.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 100%;
            animation: slide-up 0.6s ease-out;
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #52c234 0%, #34a853 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            animation: scale-bounce 0.8s ease-out;
            box-shadow: 0 10px 30px rgba(52, 168, 83, 0.3);
        }

        @keyframes scale-bounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.15);
            }

            70% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .success-message {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .success-detail {
            color: #999;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .back-button,
        .view-button {
            display: inline-block;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .view-button {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .view-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .checkmark-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .checkmark {
            animation: checkmark-draw 0.5s ease-out 0.3s forwards;
            opacity: 0;
        }

        @keyframes checkmark-draw {
            to {
                opacity: 1;
            }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .success-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 28px;
            }

            .success-icon {
                width: 100px;
                height: 100px;
                font-size: 50px;
            }

            .button-group {
                flex-direction: column;
            }

            .back-button,
            .view-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="success-container">
        <div class="success-icon">
            <div class="checkmark-circle">
                <span class="checkmark">✓</span>
            </div>
        </div>

        <h1>🎉 提交成功!</h1>

        <p class="success-message">
            您的表单已成功提交并处理完成
        </p>

        <p class="success-detail">
            感谢您使用 3D 流体滑块组件完成操作
        </p>

        <div class="button-group">
            <a href="index.html" class="back-button">返回首页</a>
            <a href="#" class="view-button" onclick="alert('查看详情功能演示'); return false;">查看详情</a>
        </div>
    </div>

    <script>
        // 页面加载完成后的额外效果
        window.addEventListener('load', () => {
            console.log('✅ 表单提交成功页面加载完成');

            // 可以在这里添加更多交互效果
            // 例如: 发送统计数据、显示额外信息等
        });
    </script>
</body>

</html>
