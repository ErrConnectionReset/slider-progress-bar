<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 流体滑块进度条</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/slider.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div class="container">
        <h1>滑动解锁</h1>
        <p class="subtitle">体验流畅的流体拉伸效果</p>

        <!-- 滑块容器 -->
        <div id="fluid-slider"></div>

        <p class="instruction">💡 拖动流体滑块至 <strong>100%</strong> 完成操作</p>

        <div class="info-box">
            <p>当前进度: <span id="progress-value">0</span>%</p>
        </div>
    </div>

    <!-- 引入脚本 -->
    <script src="js/FluidSlider.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
